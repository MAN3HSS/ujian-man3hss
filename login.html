<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Proktor / Admin | PORTAL UJIAN MAN 3 HSS</title>
  
  <link rel="icon" type="image/x-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgimTBivKDSFO4bvP-J3zqbrh4EbDGIlV75ttSxc8W0EKY6Vkfgu7ks0MjswXa5pwwJKvWDrR2psJ8eOiarRdbsKRhPyhwun2yOYXgNPX3VaQmrrlM0Mk3S_q6erZztoHU/s220/LOGO-MAN-3-HSS-HD.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-page); padding: 1.5rem;">

  <div class="card card-elevated animate-fade-in" style="max-width: 440px; width: 100%; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
        <img class="brand-logo-img" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgimTBivKDSFO4bvP-J3zqbrh4EbDGIlV75ttSxc8W0EKY6Vkfgu7ks0MjswXa5pwwJKvWDrR2psJ8eOiarRdbsKRhPyhwun2yOYXgNPX3VaQmrrlM0Mk3S_q6erZztoHU/s220/LOGO-MAN-3-HSS-HD.ico" alt="Logo MAN 3 HSS" width="54" height="54" onerror="this.src='assets/logo.svg'">
      </a>
      <h2 style="font-size: 1.35rem; color: var(--text-main); margin-bottom: 0.25rem;">PORTAL ADMIN & PROKTOR</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">MAN 3 Hulu Sungai Selatan</p>
    </div>

    <form id="adminLoginForm" autocomplete="off" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Proktor / Operator</label>
        <input type="text" id="loginEmail" class="form-input" placeholder="Masukkan Email atau Username" value="" autocomplete="off" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Kata Sandi</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan Kata Sandi" value="" autocomplete="new-password" required>
      </div>

      <div id="loginErrorMsg" style="display: none; padding: 0.75rem; border-radius: var(--radius-md); background: var(--danger-bg); color: var(--danger); font-size: 0.825rem; font-weight: 600; margin-bottom: 1.25rem;">
        Email atau kata sandi tidak valid.
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
        MASUK DASHBOARD PROKTOR
      </button>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="index.html" style="font-size: 0.875rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem;">
          ← Kembali ke Halaman Siswa
        </a>
      </div>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.775rem; color: var(--text-subtle);">
      Portal Khusus Proktor & Panitia Ujian Madrasah
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('btnLoginSubmit');

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const result = await AuthManager.login(email, pass);
        if (result.success) {
          Utils.showToast('Login Berhasil', 'Selamat datang di panel admin proktor.', 'success');
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || 'admin.html';
          setTimeout(() => { window.location.href = redirect; }, 300);
        } else {
          errEl.textContent = result.message || 'Login gagal. Email atau kata sandi salah.';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Terjadi kesalahan saat memverifikasi kredensial.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'MASUK DASHBOARD PROKTOR';
      }
    }
  </script>
</body>
</html>
